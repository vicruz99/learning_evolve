# AC2 baseline vs the ICL runs: local Qwen3.6-27B, budget-matched to one ICL run.
#
# Budget parity: an ICL run tries 6 parents x 16 children x 25 generations = 2400 solutions;
# in Shinka one generation = one tried solution, so num_generations = 2400. Everything else
# stays at what the ttt_discover_math full profile / Shinka defaults use. LLM-side settings
# mirror the ICL sweeps (src/sweeps/autocorrelation_ineq_2/qwen/*.yaml): temperature 1.0,
# max_tokens 34000, thinking capped at 12000 via vLLM's thinking_token_budget (needs the
# extra_body passthrough patch in shinka/llm/{kwargs.py,llm.py} and a server started with
# --reasoning-parser qwen3, vLLM >= 0.19).
#
# Requires: export LOCAL_OPENAI_API_KEY=local ; export SHINKA_PRICING_MODE=offline
max_evaluation_jobs: 5
max_proposal_jobs: 5
max_db_workers: 4

# Wall-clock hard kill per candidate evaluation: 1100s, same as the ICL sandbox's
# eval_timeout for this problem (src/envs/registry.py). eval_budget_s is the internal search
# budget the evolved program receives (TTT_BUDGET_S), same 1000s the ICL prompt promises.
job_time: "00:18:20"
eval_budget_s: 1000
numeric_threads_per_job: 2   # OMP/BLAS cap per eval, matching the 2 CPUs the prompt promises

db_config:
  num_islands: 2
  archive_size: 40
  elite_selection_ratio: 0.3
  num_archive_inspirations: 1
  num_top_k_inspirations: 1
  migration_interval: 10
  migration_rate: 0.1
  island_elitism: true
  enforce_island_separation: true
  parent_selection_strategy: weighted
  parent_selection_lambda: 10
  archive_selection_strategy: "crowding"
  island_selection_strategy: equal
  archive_criteria:
    combined_score: 1.0
    loc: -0.3
  enable_dynamic_islands: false
  stagnation_threshold: 10
  island_spawn_strategy: "best"
  island_spawn_subtree_size: 2

evo_config:
  patch_types:
    - diff
    - full
    - cross
  patch_type_probs:
    - 0.6
    - 0.3
    - 0.1
  num_generations: 2400
  max_api_costs: null          # local model has no catalog price; generations are the stop rule
  max_patch_resamples: 3
  max_patch_attempts: 1
  max_novelty_attempts: 3      # Shinka default; active now that the embedding gate is on
  code_embed_sim_threshold: 0.96   # Shinka default 0.99 assumes OpenAI embeddings; nomic
                                   # scores near-identical code ~0.93, so 0.99 never fires
  job_type: local
  language: python
  llm_models:
    - "local/Qwen/Qwen3.6-27B@http://localhost:8001/v1"
  llm_dynamic_selection: null  # single model, no bandit
  llm_kwargs:
    temperatures:
      - 1.0
    max_tokens: 34000
    extra_body:
      thinking_token_budget: 12000
  enable_controlled_oversubscription: false
  # Embeddings ON (duplicate gate at code_embed_sim_threshold 0.96, see above). No model is
  # pinned here: pass --embedding_model
  # local/nomic-embed-text:latest@http://localhost:11434/v1 at launch (the CPU ollama
  # server, see RUNS.md). A failed embed call only logs an "Error .* embedding" line
  # and skips the gate - the run survives, so check the logs after launch.
  meta_rec_interval: null      # meta scratchpad OFF in this variant (ON in shinka_qwen_meta.yaml)
  meta_llm_models: null
  embedding_model: null        # overridden by --embedding_model at launch
  novelty_llm_models: null     # LLM novelty judge OFF (Shinka default)
  evolve_prompts: false        # meta-prompting OFF (Shinka default)
  init_program_path: initial.py
  results_dir: results/ac2_qwen
