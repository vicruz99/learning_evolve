# TriMul (GPU-mode, H100) ShinkaEvolve run: Shinka's own LARGE preset, local Qwen3.6-27B-FP8.
#
# Source of every value: ShinkaEvolve @ b67a073, shinka/configs/evolution/large_budget.yaml and
# shinka/configs/database/island_large.yaml. Deliberate deviations, each forced by this setup:
#   num_generations   300 -> 2400   budget parity with one ICL run (6 x 16 x 25 graded candidates)
#   max_evaluation_jobs 6 -> 1      ONE GPU, exclusive: leaderboard timings are only valid on an idle
#                                   card, so exactly one candidate is ever graded at a time
#   llm_models / meta_llm_models    the preset lists 5 cloud models with a UCB bandit; here there is one
#                                   local model, so the list has one entry and the bandit is off
#   llm_kwargs.max_tokens 16384 -> 34000, + thinking_token_budget 11000
#                                   Qwen3.6 is a reasoning model: ~11k thinking tokens + a full kernel
#                                   do not fit in 16k. Same numbers as the trimul ICL sweeps.
#   embedding_model                 text-embedding-3-small is unreachable; the job passes the local
#                                   CPU embedder via --embedding_model (Qwen3-Embedding-0.6B)
# Everything else (patch mix, resamples/attempts, meta scratchpad every 10 gens, 5 islands, archive
# 40, 4+2 inspirations, migration, weighted parent selection) is the preset, untouched.
#
# The @http://localhost:8001/v1 endpoint is a placeholder: src/jobs/marvin_shinka_run.bsub rewrites
# it into a scratch copy from `llmtun url <LLM_NAME>`.
# Requires: export LOCAL_OPENAI_API_KEY=local ; export SHINKA_PRICING_MODE=offline
max_evaluation_jobs: 1
max_proposal_jobs: 8
max_db_workers: 2

# Wall-clock hard kill per evaluation, as seen by Shinka's LocalJobConfig. The grader's own timeout
# (TRIMUL_EVAL_TIMEOUT, 1500 s == the ICL eval_timeout) fires first; this is the backstop.
job_time: "00:30:00"
numeric_threads_per_job: 2

db_config:                       # == island_large.yaml
  db_path: "evolution_db.sqlite"
  num_islands: 5
  archive_size: 40
  elite_selection_ratio: 0.3
  num_archive_inspirations: 4
  num_top_k_inspirations: 2
  migration_interval: 10
  migration_rate: 0.1
  island_elitism: true
  parent_selection_strategy: "weighted"
  exploitation_alpha: 1.0
  exploitation_ratio: 0.2
  parent_selection_lambda: 10.0

evo_config:                      # == large_budget.yaml, except the lines marked
  patch_types:
    - diff
    - full
    - cross
  patch_type_probs:
    - 0.4
    - 0.4
    - 0.2
  num_generations: 2400          # preset: 300
  max_api_costs: null            # local model has no price; generations are the stop rule
  max_patch_resamples: 3
  max_patch_attempts: 3
  job_type: local
  language: python
  llm_models:                    # preset: 5 cloud models
    - "local/Qwen/Qwen3.6-27B-FP8@http://localhost:8001/v1"
  llm_dynamic_selection: null    # preset: ucb (meaningless with one model)
  llm_kwargs:
    temperatures:
      - 0.0
      - 0.5
      - 1.0
    max_tokens: 34000            # preset: 16384
    extra_body:
      thinking_token_budget: 11000
  meta_rec_interval: 10
  meta_llm_models:               # preset: gpt-4.1
    - "local/Qwen/Qwen3.6-27B-FP8@http://localhost:8001/v1"
  meta_llm_kwargs:
    temperatures:
      - 0.0
    max_tokens: 34000
    extra_body:
      thinking_token_budget: 11000
  embedding_model: null          # set at launch: --embedding_model (CPU shim on :8003)
  enable_controlled_oversubscription: false
  init_program_path: initial.py
  results_dir: results/trimul_qwen
