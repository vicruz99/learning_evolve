# =================================================================================================
# CALIBRATION — gpt-oss-120b on 2x A100. Run this BEFORE sweeps/baselines_gptoss.yaml.
#
# Purpose: turn the one number the whole campaign's cost depends on — tokens per candidate at
# `reasoning-effort high` — from a guess into a measurement. 50 baseline runs are somewhere between
# ~1 month and ~7 months of GPU time depending on it (see baselines_gptoss.yaml, section 3).
#
# 2 runs x 3 generations x 150 candidates = 900 candidates. Same server, same shape, same token
# budgets as the real thing; only num-generations differs. Expect ~1-3 h.
#
#   cd src
#   python run_sweep.py sweeps/calibrate_gptoss.yaml
#
# THEN READ, from runs/calibrate_gptoss/<run>/progress.csv (and the tail of icl.log):
#
#   tokens_per_completion   -> plug into: h/run = 7500 * tokens_per_completion / 500 tok/s / 3600
#   truncated               -> completions that hit max-tokens=34000. These burn the whole budget and
#                              usually emit no code, so they are pure waste. >10 % means either drop
#                              to `reasoning-effort medium` or implement TTT-Discover's two-phase
#                              forced-final answer for gpt-oss.
#   decode_p99 / decode_max -> the tail is what gates each request (a vLLM call returns when its
#                              SLOWEST sequence finishes), so size max-tokens off p99, never the mean.
#   success_rate            -> valid candidates. A low rate here with truncated>0 is the same bug
#                              twice: no answer left after reasoning.
#   wall_seconds            -> the direct per-generation cost; x 50 x number of runs = the campaign.
#
# Aim the A/B at the decision you actually have to make: run it once as configured (high), and if
# tokens_per_completion comes back near the cap, change `reasoning-effort` to medium and run it again
# with --sweep-dir runs/calibrate_gptoss_medium. Compare gen_best_score AND cost — high effort is
# only worth 3-6x the compute if it finds better solutions.
# =================================================================================================

sweep:
  name: calibrate_gptoss
  max_parallel: 2
  stagger: 60
  server_max_num_seqs: 96       # match the server flag; see the baselines file's header

common:
  model: openai/gpt-oss-120b
  vllm-base-url: http://localhost:8001/v1
  reasoning-effort: high
  max-tokens: 34000
  max-context-tokens: 94000
  temperature: 1.0
  n-context: 0
  groups-per-batch: 5
  group-size: 30
  num-generations: 3             # the only difference from the real sweep
  max-gen-concurrency: 5
  num-cpus-per-task: 2

grid:
  # One cheap-to-grade problem and one slow-to-grade one, so the grading barrier is calibrated too.
  problem: [circle_packing_26, ac2]
  parent-source: [puct]          # single value -> stays out of the run names
  seed: [1]
