# =================================================================================================
# TRIMUL KERNEL CAMPAIGN ON BOSCH / B200, FILE 1/4 -- BEST-OF-N (no past experience). Via LSF.
#
# sweeps/trimul_bon_qwen_bosch.yaml with the card swapped. Read THAT file for every Bosch delta
# (FP8 model name, the URL the job script rewrites, the ~ eval venv, and WHY trimul-eval-gpu must
# stay absent) and sweeps/trimul_bon_qwen.yaml for what the campaign measures. Only the B200 part
# is written down here:
#
#   problem: trimul_b200      the prompt names the B200 and its 232448-byte shared-memory ceiling
#                             (measured on a Bosch b200 node, 2026-08-17 -- the same ceiling as the
#                             H100, so an H100-legal block size is legal here too). These scores
#                             pool with NOTHING: not with trimul_h100 (which is TTT-Discover's
#                             faithful baseline), not with trimul_a100.
#   WHY THIS FILE EXISTS      availability, not fidelity. batch_b200 has 20 hosts to batch_h100's 5
#                             (docs/BOSCH_CLUSTER.md §3-4), and the vLLM server already lands there.
#                             If you want the number that compares to TTT-Discover's 1161 us, run
#                             the _bosch file on batch_h100 instead.
#   GRADING VENV              must be the cu128 build of torch 2.7.1 -- the version pin is unchanged
#                             (2.7.1 / triton 3.3.1), but sm100 gencode only comes from CUDA 12.8.
#                             Verified: ~/venvs/kernel-eval reports 2.7.1+cu128 with sm_100 in
#                             torch.cuda.get_arch_list(). guadiana's cu126 venv would fail here, and
#                             guard 1b in the job script is what catches that.
#   TRITON ON sm100           3.3.1 compiles for Blackwell but exposes none of its new machinery
#                             (tcgen05 MMA, newer TMA). Expect the card to be understated, and read
#                             generation 0's failures for ptxas 'unsupported'/'target' errors, which
#                             would mean the stack -- not the candidates -- is the problem.
#
# SUBMIT (never from the login node -- docs/BOSCH_CLUSTER.md):
#   cd ~/projects/phd/learning_evolve/src && mkdir -p jobs/logs
#   bsub < jobs/vllm_server.bsub                            # once, if not already up
#   SWEEP=sweeps/trimul_bon_qwen_b200.yaml bsub -q batch_b200 < jobs/trimul_sweep.bsub
#                                          ^^^^^^^^^^^^^^^^ REQUIRED: the job defaults to
#                                          batch_h100 and its queue<->problem guard will refuse
#                                          this file there.
#   bjobs -w && tail -f jobs/logs/trimul_sweep.<jobid>.out
#
# BEFORE THE FIRST SWEEP, record the reference kernel's B200 baseline and its noise floor
# (gpumode_local/reference/README.md, step 3 with --repeats 5). There is no published B200 number to
# compare against, so that measurement IS this card's yardstick -- without it a "win" here means
# nothing. Also check GPU exclusivity on this queue once: see the header of jobs/trimul_sweep.bsub.
# =================================================================================================

sweep:
  name: trimul_bon_qwen_b200
  max_parallel: 1                # one run at a time: grading is a serial per-card queue, and the
                                 # KV budget fits ~1 run's sequences (note 3 of the guadiana file --
                                 # re-derive it for this server's KV report before raising this)
  stagger: 60
  server_max_num_seqs: 256

common:
  # --- model / server (Bosch: FP8; URL rewritten by jobs/trimul_sweep.bsub) ----------------------
  model: Qwen/Qwen3.6-27B-FP8
  vllm-base-url: http://localhost:8001/v1
  reasoning-effort: none
  thinking-token-budget: 11000

  # --- token budgets (identical to the guadiana file) -------------------------------------------
  max-tokens: 34000
  max-context-tokens: 40000
  temperature: 1.0

  # --- execution --------------------------------------------------------------------------------
  save-reasoning: false
  num-cpus-per-task: 1           # nominal only: no CPU group is taken, grading is the GPU lock

  # --- where kernels are graded (no trimul-eval-gpu -- LSF's card is inherited; see header) ------
  trimul-eval-python: ~/venvs/kernel-eval/bin/python     # MUST be the cu128 build -- see header
  trimul-eval-mode: leaderboard  # exactly what guided TTT-Discover's search; see the guadiana file

  # --- the Best-of-N shape: ONE generation, no barrier (identical to the guadiana file) ----------
  parent-source: initial
  n-context: 0
  groups-per-batch: 10
  group-size: 16                 # 10 x 16 = 160 candidates, matching every other arm
  num-generations: 1
  max-gen-concurrency: 1

runs:
  - {name: b200_s1, problem: trimul_b200, seed: 1}
  - {name: b200_s2, problem: trimul_b200, seed: 2}
  - {name: b200_s3, problem: trimul_b200, seed: 3}
