# =================================================================================================
# TRIMUL KERNEL CAMPAIGN ON BOSCH, FILE 4/4 -- PUCT + STRATEGY CONTEXT. H100, via LSF.
#
# Port of sweeps/trimul_strategy_qwen.yaml -- the HIGH-level-representation arm: the context block
# shows the 5 best past attempts' <strategy> text instead of their source. Read that file for the
# arm's rationale and trimul_bon_qwen_bosch.yaml for every Bosch delta (FP8 model name, URL
# rewritten by the job, ~ eval venv, and WHY trimul-eval-gpu must stay absent).
#
# SUBMIT:  SWEEP=sweeps/trimul_strategy_qwen_bosch.yaml bsub < jobs/trimul_sweep.bsub
# Launch file 1 first and read its generation-0 throughput before committing to 3 seeds here.
# =================================================================================================

sweep:
  name: trimul_strategy_qwen_bosch
  max_parallel: 1
  stagger: 180
  server_max_num_seqs: 256

common:
  # --- model / server (Bosch: FP8; URL rewritten by jobs/trimul_sweep.bsub) ----------------------
  model: Qwen/Qwen3.6-27B-FP8
  vllm-base-url: http://localhost:8001/v1
  reasoning-effort: none
  thinking-token-budget: 11000

  max-tokens: 34000
  max-context-tokens: 40000      # same budget as file 3 on purpose: the comparison is what you can
                                 # FIT in the same window, not a token-count handicap
  temperature: 1.0

  save-reasoning: false
  num-cpus-per-task: 1

  # --- grading (Bosch: no trimul-eval-gpu -- LSF's card is inherited; see file 1/4) --------------
  trimul-eval-python: ~/venvs/kernel-eval/bin/python
  trimul-eval-mode: leaderboard

  # --- the arm (identical to the guadiana file) ---------------------------------------------------
  parent-source: puct
  groups-per-batch: 2
  group-size: 16
  num-generations: 5             # 160 candidates/run
  max-gen-concurrency: 1
  n-context: 5                   # same count as file 3, so only the representation differs
  context-strategy: best
  include-code: false            # THE difference from file 3: no source ...
  include-strategy: true         # ... just the model's own account of what it tried

runs:
  - {name: h100_s1, problem: trimul_h100, seed: 1}
  - {name: h100_s2, problem: trimul_h100, seed: 2}
  - {name: h100_s3, problem: trimul_h100, seed: 3}
