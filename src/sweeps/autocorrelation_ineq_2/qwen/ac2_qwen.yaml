# ---------------------------------------------------------------------------------------------
# SERVER (one server serves all three files)
#   HF_HOME=<scratch> \
#   vllm serve Qwen/Qwen3.6-27B-FP8 --tensor-parallel-size 1 --async-scheduling \
#       --gpu-memory-utilization 0.90 --max-model-len 128000 --max-num-seqs 256 \
#       --max-num-batched-tokens 16384 --enable-prefix-caching \
#       --reasoning-parser qwen3 --port 8001
#
# LAUNCH

# ray start --head   --num-cpus=${LSB_DJOB_NUMPROC}   --memory=$((100 * 1024**3))   --object-store-memory=$((8 * 1024**3))   --temp-dir=/tmp/$USER/ray

#   export OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 NUMEXPR_NUM_THREADS=2 VECLIB_MAXIMUM_THREADS=2
# ##  ray stop && ray start --head        # all files use num-cpus-per-task 1, so one head serves all
#   cd src && tmux new -s ac1_qwen
#   python run_sweep.py sweeps/ac2_qwen.yaml --print-cmds        # inspect first
#   python run_sweep.py sweeps/ac2_qwen.yaml --sweep-dir runs/ac2_qwen
#   python run_sweep.py --status <big-disk>/runs/ac1_qwen

#   To halt: kill the run_sweep.py pid FIRST -- `--stop` leaves the supervisor alive and it immediately
#   launches the next queued run -- then `python run_sweep.py --stop <dir>`.

#
# THIS FILE: 28 runs x 1200 candidates = 33,600 candidates, max_parallel 2.
# ---------------------------------------------------------------------------------------------

sweep:
  name: ac2_qwen
  max_parallel: 2                # ac1 is CPU-bound, so extra runs share fixed grading throughput rather
                                 # than adding any. The dial is queue_p50 in progress.csv.
  stagger: 500                   # long generations; keep grading bursts out of phase
  server_max_num_seqs: 256

common:
  # --- model / server -------------------------------------------------------------------------
  model: Qwen/Qwen3.6-27B-FP8
  vllm-base-url: http://rng-dl01-w26n07:8002/v1
  reasoning-effort: none         # gpt-oss-only knob; `none` keeps it out of the request
  thinking-token-budget: 12000   # HARD reasoning cap; vLLM force-emits </think> at the limit so the
                                 # candidate still answers. Watch `truncated` / `reasoning_tokens`: if
                                 # many candidates land exactly on 10k with no code, raise it.

  # --- token budgets (fixed across every experiment in this project) --------------------------
  max-tokens: 34000              # max decode observed 21,241 (62 %) on cp26, ~8,900 on ac1; 0 truncations
  max-context-tokens: 84000      # the budget the context block is packed against; identical everywhere
  temperature: 1.0

  # --- execution -----------------------------------------------------------------------------
  save-reasoning: false
  num-cpus-per-task: 2

  # --- shape shared by the generational arms; the Best-of-N runs override it per run -----------
  problem: ac2
  groups-per-batch: 6
  group-size: 16                 # 5 x 16 = 80 candidates/generation
  num-generations: 25            # 1200 candidates/run, matching every cp26 arm
  max-gen-concurrency: 5

runs:
  # --- Best-of-N, 5 seeds: ONE generation of 75 groups, no barrier (see note above) ------
  - {name: bon_s1, seed: 1, parent-source: initial, n-context: 0, groups-per-batch: 150, group-size: 16, num-generations: 1, max-gen-concurrency: 5}
  - {name: bon_s2, seed: 2, parent-source: initial, n-context: 0, groups-per-batch: 150, group-size: 16, num-generations: 1, max-gen-concurrency: 5}
  - {name: bon_s3, seed: 3, parent-source: initial, n-context: 0, groups-per-batch: 150, group-size: 16, num-generations: 1, max-gen-concurrency: 5}
  # - {name: bon_s4, seed: 4, parent-source: initial, n-context: 0, groups-per-batch: 75, group-size: 16, num-generations: 1, max-gen-concurrency: 5}
  # - {name: bon_s5, seed: 5, parent-source: initial, n-context: 0, groups-per-batch: 75, group-size: 16, num-generations: 1, max-gen-concurrency: 5}
  # # --- PUCT baseline, n-context 0, 5 seeds ------------------------------------------------
  - {name: puct_s1, seed: 1, parent-source: puct, n-context: 0}
  - {name: puct_s2, seed: 2, parent-source: puct, n-context: 0}
  - {name: puct_s3, seed: 3, parent-source: puct, n-context: 0}
  # - {name: puct_s4, seed: 4, parent-source: puct, n-context: 0}
  # - {name: puct_s5, seed: 5, parent-source: puct, n-context: 0}
  # # --- context strategies at n-context 10, 3 seeds x 3 strategies = 9 runs ----------------
  - {name: n10_s1_random, seed: 1, parent-source: puct, n-context: 10, context-strategy: random}
  - {name: n10_s1_best, seed: 1, parent-source: puct, n-context: 10, context-strategy: best}
  - {name: n10_s1_contrastive, seed: 1, parent-source: puct, n-context: 10, context-strategy: contrastive, mix-fraction: 0.7, mmr-lambda: 0.7}
  - {name: n10_s2_random, seed: 2, parent-source: puct, n-context: 10, context-strategy: random}
  - {name: n10_s2_best, seed: 2, parent-source: puct, n-context: 10, context-strategy: best}
  - {name: n10_s2_contrastive, seed: 2, parent-source: puct, n-context: 10, context-strategy: contrastive, mix-fraction: 0.7, mmr-lambda: 0.7}
  - {name: n10_s3_random, seed: 3, parent-source: puct, n-context: 10, context-strategy: random}
  - {name: n10_s3_best, seed: 3, parent-source: puct, n-context: 10, context-strategy: best}
  - {name: n10_s3_contrastive, seed: 3, parent-source: puct, n-context: 10, context-strategy: contrastive, mix-fraction: 0.7, mmr-lambda: 0.7}
  # # --- context strategies at n-context 5, 3 seeds x 3 = 9 runs (context-SIZE comparison) --
  - {name: n05_s1_random, seed: 1, parent-source: puct, n-context: 5, context-strategy: random}
  - {name: n05_s1_best, seed: 1, parent-source: puct, n-context: 5, context-strategy: best}
  - {name: n05_s1_contrastive, seed: 1, parent-source: puct, n-context: 5, context-strategy: contrastive, mix-fraction: 0.7, mmr-lambda: 0.7}
  - {name: n05_s2_random, seed: 2, parent-source: puct, n-context: 5, context-strategy: random}
  - {name: n05_s2_best, seed: 2, parent-source: puct, n-context: 5, context-strategy: best}
  - {name: n05_s2_contrastive, seed: 2, parent-source: puct, n-context: 5, context-strategy: contrastive, mix-fraction: 0.7, mmr-lambda: 0.7}
  - {name: n05_s3_random, seed: 3, parent-source: puct, n-context: 5, context-strategy: random}
  - {name: n05_s3_best, seed: 3, parent-source: puct, n-context: 5, context-strategy: best}
  - {name: n05_s3_contrastive, seed: 3, parent-source: puct, n-context: 5, context-strategy: contrastive, mix-fraction: 0.7, mmr-lambda: 0.7}
