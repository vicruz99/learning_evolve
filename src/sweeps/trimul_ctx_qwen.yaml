# =================================================================================================
# TRIMUL KERNEL CAMPAIGN, FILE 3/4 -- PUCT + past solutions AS CODE (LOW-level representation).
# guadiana, A100 80GB PCIe.
#
# READ sweeps/trimul_bon_qwen.yaml FIRST for the campaign-wide notes (serial GPU queue, the
# calibrate-before-launch rule, KV ceiling, server command, expected scores).
#
# WHAT THIS ARM ISOLATES
#   Identical to file 2 (PUCT) except the prompt now carries past solutions: n-context 5 with their
#   full code. This is the LOW-LEVEL representation of EXPERIMENT_PLAN.md §2 -- the model sees the
#   actual kernels and their runtimes. File 4 is the same arm with the code replaced by the model's
#   own <strategy> text, which is the HIGH-LEVEL representation; the pair is the comparison.
#
# WHY n-context 5 AND NOT 10 (the cp26 value)
#   Kernels are BIG. Measured: 1.4 k tokens for a small one, 4.1 k for TTT-Discover's published one.
#   At 5 solutions that is ~7-20 k tokens of context block on top of the ~2.4 k intro; at 10 it can
#   reach 41 k, which collides with both max-context-tokens and the ~15.6 k/sequence KV budget that
#   caps concurrency at roughly 20 sequences (note 3 in file 1). n-context is the knob to raise once
#   throughput is known -- raise it before raising seeds, since it is the axis under study.
#   `context-strategy: best` only: with 3 seeds x 1 strategy this file is already 3 runs, and cp26
#   showed the strategy contrast needs more seeds than we can afford here to resolve.
#
# TWO THINGS TO CHECK IN THE FIRST RUN
#   * `cache_hit_rate` in progress.csv. The prompt is laid out intro -> context block -> rules ->
#     current kernel precisely so everything before the trailing kernel is a shared prefix across a
#     generation's parents. With exclude-parent on (the default) each parent drops itself from the
#     block, which shifts a different solution in and breaks that prefix -- if the hit rate is poor,
#     `exclude-parent: false` restores it at the cost of letting a parent appear in its own context.
#   * That the block is actually filling: `context=k/N` in the log. Generation 0 has an EMPTY pool
#     (it is built from previous generations' valid candidates), and trimul's valid rate is low --
#     1/8 in the smoke run -- so the pool fills slowly and early generations may run at k << 5. If k
#     never gets near 5, this arm is not testing what it claims to and needs more generations.
#
# SHAPE: 2 groups x 16 x 5 generations = 160 candidates/run, matching every other arm.
#
# LAUNCH (after calibrating on file 1)
#   cd src && tmux new -s trimul_ctx
#   python run_sweep.py sweeps/trimul_ctx_qwen.yaml --print-cmds
#   python run_sweep.py sweeps/trimul_ctx_qwen.yaml --ray-head skip
#   (--ray-head skip on EVERY machine: trimul never touches Ray, and the default `auto`
#   would start and hold an unused head sized to the whole box -- see file 1/4)
# =================================================================================================

sweep:
  name: trimul_ctx_qwen
  max_parallel: 1                # one run at a time: grading is a serial per-card queue (note 1 in
                                 # trimul_bon_qwen.yaml), and this file has the biggest prompts of the
                                 # four -- more prefill and more KV per sequence than files 1-2.
  stagger: 180
  server_max_num_seqs: 256

common:
  # --- model / server (identical to file 1) ---------------------------------------------------
  model: Qwen/Qwen3.6-27B
  vllm-base-url: http://localhost:8001/v1
  reasoning-effort: none
  thinking-token-budget: 11000

  # --- token budgets --------------------------------------------------------------------------
  max-tokens: 34000
  max-context-tokens: 40000      # the budget the context block is packed against; ~10-25 kernels
  temperature: 1.0

  # --- execution -----------------------------------------------------------------------------
  save-reasoning: false
  num-cpus-per-task: 1           # nominal only: no CPU group is taken, grading is the GPU lock

  # --- where kernels are graded (machine-specific, but declared here so config.json records it) ---
  trimul-eval-python: /scratch/vicstorage/learning_evolve/.venv/bin/python
  trimul-eval-gpu: "1"           # MUST be a card nothing else uses; GPU 0 holds the vLLM server.
                                 # An index is right HERE because guadiana has no GPU scheduler. On
                                 # Bosch never name one -- delete this key (jobs/trimul_sweep.bsub
                                 # does) or set "inherit": LSF assigns the job's card through
                                 # CUDA_VISIBLE_DEVICES, and an index would override that and can
                                 # grade on another job's GPU.
  trimul-eval-mode: leaderboard  # EXACTLY WHAT GUIDED TTT-DISCOVER'S SEARCH (env.py:132). One
                                 # evaluate.py subprocess per candidate, and that one run IS the
                                 # score -- we never pass --repeats, so nothing is re-graded or
                                 # averaged above eval.py. That subprocess runs two phases: the 18
                                 # `tests:` shapes must ALL pass, then the 7 `benchmarks:` shapes are
                                 # timed 3-100 reps each with correctness re-checked on every rep,
                                 # stopping at rel. error < 0.1 % (or 30 s GPU / 120 s wall). Score =
                                 # geometric mean of the 7 means; reward = 1500/us.
                                 # Measured on an idle A100: 36 s (13.2 test + 14.8 timed + startup),
                                 # scoring 2412 us. Bare `benchmark` mode is ~15 s and scores 2467 --
                                 # it skips the 18-shape correctness gate, so it rewards kernels this
                                 # search would discard. DO NOT MIX SCORES FROM THE TWO MODES.
  # trimul-evaluate-py:          # THE GRADER ITSELF -- deliberately not set. It defaults to
                                 # <repo>/coding_agent_evolve/gpumode/evaluate.py, resolved from
                                 # envs/kernel_trimul.py's own path, so any clone works unedited.
                                 # Set it only if the gpumode harness lives outside this repo.

  # --- search shape: same as file 2, plus the context block -----------------------------------
  parent-source: puct
  groups-per-batch: 2
  group-size: 16
  num-generations: 5             # 160 candidates/run
  max-gen-concurrency: 1

  # --- the LOW-level representation -----------------------------------------------------------
  n-context: 5                   # THE difference from file 2
  context-strategy: best
  include-code: true             # show each past kernel's source, and NOT its strategy -- file 4
                                 # inverts exactly this. `include-strategy: false` is deliberately
                                 # absent rather than written out: run_icl.py has no
                                 # --no-include-strategy (it is off by default), so stating it fails
                                 # the sweep at parse time.

runs:
  - {name: a100_s1, problem: trimul_a100, seed: 1}
  - {name: a100_s2, problem: trimul_a100, seed: 2}
  - {name: a100_s3, problem: trimul_a100, seed: 3}
