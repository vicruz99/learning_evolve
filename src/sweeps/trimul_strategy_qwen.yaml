# =================================================================================================
# TRIMUL KERNEL CAMPAIGN, FILE 4/4 -- PUCT + past solutions AS STRATEGY TEXT (HIGH-level
# representation). guadiana, A100 80GB PCIe.
#
# READ sweeps/trimul_bon_qwen.yaml FIRST for the campaign-wide notes (serial GPU queue, the
# calibrate-before-launch rule, KV ceiling, server command, expected scores).
#
# WHAT THIS ARM ISOLATES
#   Byte-for-byte the same as file 3 except the context block shows each past solution's <strategy>
#   text INSTEAD OF its code. That is the HIGH-level representation of EXPERIMENT_PLAN.md §2, and the
#   file-3/file-4 pair is the cleanest low-vs-high comparison in the campaign: same search, same
#   parents, same number of past solutions, same scores shown -- only the representation differs.
#
#   Kernel optimisation is arguably the best case for the high-level arm: a 4.1 k-token kernel costs
#   ~3x what its ~1 k-token strategy summary costs, so at equal context BUDGET the high-level arm can
#   show several times more past experience. That is the effect worth looking for, and it is why this
#   arm is worth a file of its own rather than a row in file 3.
#
# THIS ARM ONLY EXISTS BECAUSE THE PROMPT NOW ASKS FOR <strategy>
#   TTT-Discover's TRIMUL_PROMPT never requested a strategy block, and until 2026-08-10 neither did
#   ours: 0 of 8 candidates in the first smoke run emitted one. envs/kernel_trimul.py now appends the
#   same request erdos/ac1/ac2 use, and a 2-candidate check confirmed 2/2 emitted it and ~1,000 chars
#   reached the context pool. BEFORE TRUSTING THIS ARM, verify it again on the real run:
#     .venv/bin/python -c "import json; rows=[json.loads(l) for l in \
#       open('runs/trimul_strategy_qwen/a100_s1/buffer/context_pool.jsonl')]; \
#       print([len(r.get('strategy') or '') for r in rows])"
#   Any zeros there mean render_solution silently fell back to CODE for those solutions (the guard at
#   context/selection.py:321-322) -- which would quietly turn this arm into a copy of file 3.
#
# SHAPE: 2 groups x 16 x 5 generations = 160 candidates/run, matching every other arm.
#
# LAUNCH (after calibrating on file 1; run file 3 first so the pair is measured close together)
#   cd src && tmux new -s trimul_strategy
#   python run_sweep.py sweeps/trimul_strategy_qwen.yaml --print-cmds
#   python run_sweep.py sweeps/trimul_strategy_qwen.yaml
# =================================================================================================

sweep:
  name: trimul_strategy_qwen
  max_parallel: 1                # one run at a time: see note 1 in trimul_bon_qwen.yaml -- grading
                                 # is a serial per-card queue, so parallel runs only add queueing.
  stagger: 180
  server_max_num_seqs: 256

common:
  # --- model / server (identical to file 1) ---------------------------------------------------
  model: Qwen/Qwen3.6-27B
  vllm-base-url: http://localhost:8001/v1
  reasoning-effort: none
  thinking-token-budget: 11000

  # --- token budgets --------------------------------------------------------------------------
  max-tokens: 34000
  max-context-tokens: 40000      # same budget as file 3 on purpose: the comparison is what you can
                                 # FIT in it, and strategies are ~3x cheaper per solution than code
  temperature: 1.0

  # --- execution -----------------------------------------------------------------------------
  save-reasoning: false
  num-cpus-per-task: 1           # nominal only: no CPU group is taken, grading is the GPU lock

  # --- where kernels are graded (machine-specific, but declared here so config.json records it) ---
  trimul-eval-python: /scratch/vicstorage/learning_evolve/.venv/bin/python
  trimul-eval-gpu: "1"           # MUST be a card nothing else uses; GPU 0 holds the vLLM server
  trimul-eval-mode: benchmark    # scores. "test" would make reward binary; "leaderboard" is
                                 # the official ranked path and ~100x slower.

  # --- search shape: identical to file 3 -------------------------------------------------------
  parent-source: puct
  groups-per-batch: 2
  group-size: 16
  num-generations: 5             # 160 candidates/run
  max-gen-concurrency: 1

  # --- the HIGH-level representation ----------------------------------------------------------
  n-context: 5                   # same count as file 3, so only the representation differs
  context-strategy: best
  include-code: false            # THE difference from file 3: no source ...
  include-strategy: true         # ... just the model's own account of what it tried

runs:
  - {name: a100_s1, problem: trimul_a100, seed: 1}
  - {name: a100_s2, problem: trimul_a100, seed: 2}
  - {name: a100_s3, problem: trimul_a100, seed: 3}
