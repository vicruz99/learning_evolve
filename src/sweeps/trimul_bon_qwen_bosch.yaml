# =================================================================================================
# TRIMUL KERNEL CAMPAIGN ON BOSCH, FILE 1/4 -- BEST-OF-N (no past experience). H100, via LSF.
#
# This is sweeps/trimul_bon_qwen.yaml ported per that file's own "ON ANOTHER MACHINE" note. Read
# THAT header first -- everything the campaign measures, the Best-of-N shape, the KV-cache maths and
# the cost discipline (do not launch files 2-4 before reading generation 0's throughput) all live
# there and are not repeated. This file only carries what is DIFFERENT on Bosch:
#
#   problem: trimul_h100      the prompt names the H100 -- TTT-Discover's verbatim hardware line,
#                             so this is the faithful-baseline arm of the pair. Never pool these
#                             scores with trimul_a100 numbers (2198 vs 1161 us is the size of the
#                             architecture effect).
#   model: ...-FP8            what jobs/vllm_server.bsub actually serves on this cluster (guadiana
#                             serves bf16). If you change the server job, change every _bosch file.
#   vllm-base-url             a placeholder -- jobs/trimul_sweep.bsub rewrites it into its scratch
#                             copy from jobs/vllm_host.txt, because the server's node changes on
#                             every resubmission.
#   trimul-eval-python        ~/venvs/kernel-eval/bin/python (torch 2.7.1 / triton 3.3.1; creation:
#                             gpumode_local/reference/README.md "Setting this up on the Bosch
#                             cluster"). The ~ is fine: envs/kernel_trimul.py expanduser()s it, and
#                             the bsub overrides it with $KPY anyway.
#   trimul-eval-gpu           ABSENT ON PURPOSE -- do not add it. LSF grants the job ONE of the
#                             node's GPUs and announces which via CUDA_VISIBLE_DEVICES, with no
#                             guarantee it is index 0. With the key absent, trimul_h100 defaults to
#                             "inherit": nothing touches CUDA_VISIBLE_DEVICES and grading uses
#                             exactly the granted card. Naming an index here can grade on another
#                             job's GPU.
#
# SUBMIT (never from the login node -- docs/BOSCH_CLUSTER.md):
#   cd ~/projects/phd/learning_evolve/src && mkdir -p jobs/logs
#   bsub < jobs/vllm_server.bsub                 # once, if not already up
#   SWEEP=sweeps/trimul_bon_qwen_bosch.yaml bsub < jobs/trimul_sweep.bsub
#   bjobs -w && tail -f jobs/logs/trimul_sweep.<jobid>.out
# The job script guards the rest: it refuses to start if the kernel venv is missing, triton is not
# 3.3.1, or the interpreter has no kernels for the granted card, and it refuses this file on a
# non-H100 queue (default -q batch_h100; batch_h200 also maps to trimul_h100). For batch_b200 use the
# _b200 files instead -- that card has its own problem (trimul_b200) and its own baseline; its scores
# do not pool with these, which are the faithful-baseline arm.
#
# BEFORE THE FIRST SWEEP on a new card, record the reference kernel's baseline there
# (gpumode_local/reference/README.md): TTT-Discover reports 1161 us on their H100. The guadiana
# timing facts (36 s/eval, ~21 h grading ceiling) were measured on an A100 -- expect the H100 to
# grade faster; the structure (one serial queue per card) is identical.
# =================================================================================================

sweep:
  name: trimul_bon_qwen_bosch
  max_parallel: 1                # one run at a time: grading is a serial per-card queue, and the
                                 # KV budget fits ~1 run's sequences (note 3 of the guadiana file --
                                 # re-derive it for this server's KV report before raising this)
  stagger: 60
  server_max_num_seqs: 256

common:
  # --- model / server (BOSCH DELTA: FP8, and the URL is rewritten by the job script) -----------
  model: Qwen/Qwen3.6-27B-FP8
  vllm-base-url: http://localhost:8001/v1
  reasoning-effort: none
  thinking-token-budget: 11000

  # --- token budgets (identical to the guadiana file) -------------------------------------------
  max-tokens: 34000
  max-context-tokens: 40000
  temperature: 1.0

  # --- execution --------------------------------------------------------------------------------
  save-reasoning: false
  num-cpus-per-task: 1           # nominal only: no CPU group is taken, grading is the GPU lock

  # --- where kernels are graded (BOSCH DELTA: no trimul-eval-gpu -- see header) ------------------
  trimul-eval-python: ~/venvs/kernel-eval/bin/python
  trimul-eval-mode: leaderboard  # exactly what guided TTT-Discover's search; see the guadiana file

  # --- the Best-of-N shape: ONE generation, no barrier (identical to the guadiana file) ----------
  parent-source: initial
  n-context: 0
  groups-per-batch: 10
  group-size: 16                 # 10 x 16 = 160 candidates, matching every other arm
  num-generations: 1
  max-gen-concurrency: 1

runs:
  - {name: h100_s1, problem: trimul_h100, seed: 1}
  - {name: h100_s2, problem: trimul_h100, seed: 2}
  - {name: h100_s3, problem: trimul_h100, seed: 3}
