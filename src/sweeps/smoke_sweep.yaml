# =================================================================================================
# SMOKE TEST — "is the sweep machinery working?", not an experiment.
#
# 4 tiny runs on the synthetic `toy` problem (in-process grading, no sandbox, no Ray, ~220-token
# prompts). Exercises exactly what a real sweep does: grid expansion, run naming, max_parallel,
# stagger, the queue, per-run log dirs, the status table, index.csv. Total ~2 min of server time.
#
# Run it:
#   cd src
#   python run_sweep.py sweeps/smoke_sweep.yaml --print-cmds        # 1. look at the commands first
#   python run_sweep.py sweeps/smoke_sweep.yaml --ray-head skip     # 2. launch (no Ray needed: toy)
#   python run_sweep.py --status runs/smoke_sweep                   # 3. works during and after
#
# Then check:
#   * 4 dirs under runs/smoke_sweep/: toy_ps-initial_s-1, toy_ps-initial_s-2, toy_ps-puct_s-1,
#     toy_ps-puct_s-2  (this also verifies the Best-of-N vs PUCT flag reaches run_icl.py)
#   * every run reaches state `complete` with gens 2/2 in the status table
#   * runs/smoke_sweep/index.csv has 4 rows
#   * runs/smoke_sweep/sweep.json is the manifest --status/--resume/--stop read
#
# Also worth trying once, so you know they work before a real campaign:
#   python run_sweep.py --stop   runs/smoke_sweep     # SIGTERM every live run
#   python run_sweep.py --resume runs/smoke_sweep     # relaunch whatever is not complete
#
# CHANGE `vllm-base-url` to whichever server is actually up.
# =================================================================================================

sweep:
  name: smoke_sweep
  max_parallel: 2
  stagger: 5                     # 120 s is right for real runs; pointless for a 30 s smoke test
  server_max_num_seqs: 256

common:
  problem: toy                   # in-process evaluator: no Ray, no sandbox, seconds per generation
  n-context: 0
  groups-per-batch: 2
  group-size: 2
  num-generations: 2
  max-tokens: 2000
  reasoning-effort: low          # keep it cheap; set `none` if the server is not gpt-oss
  model: openai/gpt-oss-120b
  vllm-base-url: http://localhost:8001/v1

grid:
  parent-source: [initial, puct]   # initial = Best-of-N, puct = buffer search
  seed: [1, 2]
