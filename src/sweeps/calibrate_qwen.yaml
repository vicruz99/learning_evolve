# =================================================================================================
# CALIBRATION — Qwen3.6-27B on the B200. Run this BEFORE sweeps/baselines_qwen.yaml.
#
# Purpose: this is the first time this project runs Qwen at all, so nothing about its cost or its
# reasoning controls is measured yet. 2 runs x 3 generations x 150 candidates (~900 candidates).
#
#   cd src
#   python run_sweep.py sweeps/calibrate_qwen.yaml
#
# THEN CHECK, in order of what would hurt most if wrong:
#
#   1. IS THE REASONING CAP ENFORCED? `reasoning_tokens` in progress.csv must sit at/below
#      thinking-token-budget (26000), and decode_max must not pin to max-tokens. If reasoning runs
#      far past 26k, the server ignored `thinking_token_budget` — vLLM < 0.19 accepts and drops it
#      silently. Confirm with the curl in baselines_qwen.yaml's header.
#   2. IS REASONING BEING SEPARATED? The qwen3 parser emits `reasoning_content`. If icl.log warns
#      that the server exposes no reasoning, --reasoning-parser qwen3 is missing — and then the chain
#      of thought stays in `content`, where code extraction can grab a ```python fence out of the
#      REASONING instead of the answer. That is a correctness bug, not just a missing trace.
#   3. success_rate / truncated — Qwen has never been run against these prompts. A collapsed success
#      rate is more likely a prompt/format mismatch (the prompts are gpt-oss-era, verbatim from
#      TTT-Discover) than a model failure. Read a couple of runs/calibrate_qwen/*/generations/
#      gen_0000/parent_00/child_00.txt by hand before scaling up.
#   4. tokens_per_completion + wall_seconds -> cost: h/run = 7500 * wall_seconds / 150 / 3600.
#   5. Grading: `gen N done ... Xs (generate Ys)`. X - Y is the barrier. If the Bosch box has many
#      fewer cores than the 96 at INESC, 150 candidates/generation may leave the GPU idle for a large
#      share of each generation — that would argue for a smaller group-size, not a bigger budget.
# =================================================================================================

sweep:
  name: calibrate_qwen
  max_parallel: 2
  stagger: 60
  server_max_num_seqs: 128       # match the server flag; see the baselines file's header

common:
  model: Qwen/Qwen3.6-27B-FP8
  vllm-base-url: http://localhost:8001/v1
  reasoning-effort: none
  thinking-token-budget: 26000
  max-tokens: 34000
  max-context-tokens: 94000
  temperature: 1.0
  n-context: 0
  groups-per-batch: 5
  group-size: 30
  num-generations: 3
  max-gen-concurrency: 5
  num-cpus-per-task: 2

grid:
  problem: [circle_packing_26, ac2]
  parent-source: [puct]
  seed: [1]
