# =================================================================================================
# TRIMUL KERNEL CAMPAIGN ON BOSCH / B200, FILE 3/4 -- PUCT + CODE CONTEXT. Via LSF.
#
# The LOW-level-representation arm: the prompt's context block shows the 5 best past kernels' SOURCE.
# Read sweeps/trimul_ctx_qwen.yaml for the arm's rationale, and sweeps/trimul_bon_qwen_b200.yaml for
# every B200 delta (the cu128 grading venv, why these scores pool with nothing, and the required
# -q batch_b200).
#
# SUBMIT:  SWEEP=sweeps/trimul_ctx_qwen_b200.yaml bsub -q batch_b200 < jobs/trimul_sweep.bsub
# Launch file 1 first and read its generation-0 throughput before committing to 3 seeds here.
# =================================================================================================

sweep:
  name: trimul_ctx_qwen_b200
  max_parallel: 1
  stagger: 180
  server_max_num_seqs: 256

common:
  # --- model / server (Bosch: FP8; URL rewritten by jobs/trimul_sweep.bsub) ----------------------
  model: Qwen/Qwen3.6-27B-FP8
  vllm-base-url: http://localhost:8001/v1
  reasoning-effort: none
  thinking-token-budget: 11000

  max-tokens: 34000
  max-context-tokens: 40000      # the budget the context block is packed against; ~10-25 kernels
  temperature: 1.0

  save-reasoning: false
  num-cpus-per-task: 1

  # --- grading (no trimul-eval-gpu -- LSF's card is inherited; see file 1/4) ---------------------
  trimul-eval-python: ~/venvs/kernel-eval/bin/python     # MUST be the cu128 build -- see file 1/4
  trimul-eval-mode: leaderboard

  # --- the arm (identical to the guadiana file) ---------------------------------------------------
  parent-source: puct
  groups-per-batch: 2
  group-size: 16
  num-generations: 5             # 160 candidates/run
  max-gen-concurrency: 1
  n-context: 5                   # THE difference from file 2
  context-strategy: best
  include-code: true             # show each past kernel's source, and NOT its strategy -- file 4
                                 # is the mirror image

runs:
  - {name: b200_s1, problem: trimul_b200, seed: 1}
  - {name: b200_s2, problem: trimul_b200, seed: 2}
  - {name: b200_s3, problem: trimul_b200, seed: 3}
