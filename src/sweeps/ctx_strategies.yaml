# Context-strategy sweep on circle_packing_26. Launch with:
#   tmux new -s sweep
#   python run_sweep.py sweeps/ctx_strategies.yaml
# Watch from another shell with:
#   python run_sweep.py --status runs/ctx_strategies
#
# Keys under common/grid/runs are run_icl.py long flags without the leading `--`.

sweep:
  name: ctx_strategies
  max_parallel: 2          # runs in flight at once (they share one vLLM server + one Ray head)
  stagger: 120             # seconds between launches
  server_max_num_seqs: 256 # optional: only used to warn if the runs would oversubscribe the server

common:
  problem: circle_packing_26
  groups-per-batch: 6
  group-size: 15
  num-generations: 30
  n-context: 20
  reasoning-effort: medium
  max-gen-concurrency: 90  # = groups-per-batch * group-size (sweep verdict: max it, don't chunk)
  model: openai/gpt-oss-120b
  vllm-base-url: http://localhost:8001/v1

grid:
  context-strategy: [best, random, best_worst, contrastive]
