# =================================================================================================
# TriMul ICL campaign on Marvin H100s -- seed 2 of EVERY arm, one card, runs executed in sequence.
#
#   cd ~/work/learning_evolve/src
#   SWEEP=sweeps/kernel_trimul/marvin/icl_s2.yaml bsub < jobs/marvin_trimul_sweep.bsub
#
# Six arms, all budget-matched at 2400 graded candidates per run:
#   bon                 Best-of-N: parent is always the (empty) seed, no context     6 x 16 x 25
#   greedy              parent = current best, no context                            6 x 16 x 25
#   deep_puct           small & deep: PUCT parents, 4 parents x 4 children           4 x 4 x 150
#   deep_puct_n07       same shape, + best-7 in-context examples                     4 x 4 x 150
#   n10_best            PUCT parents + best-10 in-context examples                   6 x 16 x 25
#   n10_best_noparent   no parent, best-10 in-context examples only                  6 x 16 x 25
# The three seeds live in three sibling files so that each seed runs on its own card and every arm
# gets one complete seed per ~day of wall clock.
#
# vllm-base-url and trimul-eval-python are placeholders: jobs/marvin_trimul_sweep.bsub rewrites them
# into a scratch copy (llmtun url, Marvin grading venv). trimul-eval-gpu is ABSENT on purpose: grade on
# the card LSF granted via CUDA_VISIBLE_DEVICES.
# =================================================================================================
sweep:
  name: trimul_marvin_s2
  max_parallel: 1                # one run at a time: grading is a serial per-card queue
  stagger: 60
  server_max_num_seqs: 256

common:
  model: Qwen/Qwen3.6-27B-FP8
  vllm-base-url: http://localhost:8001/v1
  reasoning-effort: none
  thinking-token-budget: 11000
  max-tokens: 34000
  max-context-tokens: 40000
  temperature: 1.0
  save-reasoning: false
  num-cpus-per-task: 1
  trimul-eval-python: ~/venvs/kernel-eval/bin/python
  trimul-eval-mode: leaderboard
  problem: trimul_h100
  seed: 2
  parent-source: puct
  n-context: 0
  groups-per-batch: 6
  group-size: 16
  num-generations: 25
  grade-chunk-size: 2
  max-gen-concurrency: 8         # 8 requests x 2 seqs = 16 seqs in flight, identical for every arm

runs:
  - {name: s2_bon,               parent-source: initial}
  - {name: s2_greedy,            parent-source: best}
  - {name: s2_deep_puct,         groups-per-batch: 4, group-size: 4, num-generations: 150}
  - {name: s2_deep_puct_n07,     groups-per-batch: 4, group-size: 4, num-generations: 150, n-context: 7, context-strategy: best, include-code: true}
  - {name: s2_n10_best,          n-context: 10, context-strategy: best, include-code: true}
  - {name: s2_n10_best_noparent, parent-source: none, n-context: 10, context-strategy: best, include-code: true}
