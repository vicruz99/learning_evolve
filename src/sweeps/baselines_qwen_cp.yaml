# =================================================================================================
# EXPERIMENT 0 (part 1 of 2) — no-past-experience baselines, CIRCLE PACKING only, Qwen3.6-27B
# Bosch, B200 (H200 works unchanged).  Companion file: baselines_qwen_hard.yaml (erdos + ac1 + ac2).
#
# Same design as sweeps/baselines_gptoss_cp.yaml — read that file's header for WHY the split exists
# and what the two baselines are. Only the model, its reasoning controls, the server command, and the
# host-dependent concurrency numbers differ. The two baselines:
#   * parent-source: initial  -> BEST-OF-N (no past experience anywhere)
#   * parent-source: puct     -> TTT-DISCOVER WITHOUT RL (past experience only via parent selection)
#
# THIS BOX HAS 64 CORES (INESC, where the reference measurements were taken, has 96). Grading
# parallelism is `cores // num-cpus-per-task` = 64 concurrent evals, i.e. 2/3 of the reference. Every
# concurrency number below is already adjusted for that; the notes say which way each one moves.
#
# ---------------------------------------------------------------------------------------------
# 1. START THE SERVER (once, own tmux window)
# ---------------------------------------------------------------------------------------------
#   HF_HOME=<scratch> \
#   vllm serve Qwen/Qwen3.6-27B-FP8 \
#       --tensor-parallel-size 1 \
#       --async-scheduling \
#       --gpu-memory-utilization 0.90 \
#       --max-model-len 128000 \
#       --max-num-seqs 256 \
#       --max-num-batched-tokens 16384 \
#       --enable-prefix-caching \
#       --reasoning-parser qwen3 \
#       --port 8001
#
#   --max-num-seqs 256: on the gpt-oss campaign the server was never the limiter at 320 (zero
#       preemptions all campaign, KV usage peaked at 10-23 %, num_requests_waiting stayed 0), and a
#       27B FP8 model on a 180 GB B200 leaves a far bigger KV pool than 120B-MXFP4 on 2x80 GB.
#       3 runs x 5 parents x 20 children = 300 sequences wanted, so 256 does NOT cover them all and
#       the excess queues server-side — which is harmless here: aggregate decode saturated around
#       ~1900 tok/s well below 200 concurrent sequences, so queueing past that costs no throughput.
#       Confirm rather than assume:
#         curl -s localhost:8001/metrics | grep -E "num_preemptions|kv_cache_usage|num_requests_waiting"
#       0 preemptions and KV well under 1.0 => fine (raise if you add runs); preemptions climbing or a
#       persistently non-zero waiting queue => lower it.
#   --enable-prefix-caching: measured 98.1 % hit rate on the gpt-oss side. Cheap at n-context 0
#       (~830-token prompts) but free, and it matters once the ICL experiments raise n-context.
#   --reasoning-parser qwen3: REQUIRED, and not only for --save-reasoning. Without it the chain of
#       thought stays inside `content` and code extraction can pick a ```python fence out of the
#       REASONING instead of the answer — a correctness bug, not just a missing trace.
#
#   vLLM >= 0.19.0 IS REQUIRED, 0.26.0 recommended. Two independent reasons:
#     * `thinking_token_budget` (below) landed in 0.19.0. Earlier versions accept the field and
#       SILENTLY IGNORE it (vLLM request models are extra="allow"), so the runs would look fine and
#       have no reasoning cap at all.
#     * Qwen3.6-27B declares architecture Qwen3_5ForConditionalGeneration, absent from the model
#       registry before 0.19.1.
#   FP8 over BF16: native FP8 on Blackwell/Hopper, ~27 GB of weights instead of ~54, and this
#   workload is decode-bound (bandwidth on weights). Keep the precision FIXED for the whole campaign
#   and recorded — switching mid-way would confound the comparison more than quantization does.
#
#   VERIFY THE REASONING CAP IS LIVE before launching (a silent no-op is the failure mode):
#     curl -s localhost:8001/v1/chat/completions -H 'Content-Type: application/json' -d '{
#       "model":"Qwen/Qwen3.6-27B-FP8","messages":[{"role":"user","content":"Prove sqrt(2) is irrational."}],
#       "max_tokens":2000,"thinking_token_budget":64}' | python -c \
#       'import json,sys; m=json.load(sys.stdin)["choices"][0]["message"]; \
#        print("reasoning chars:", len(m.get("reasoning_content") or m.get("reasoning") or "")); \
#        print("answer starts:", (m.get("content") or "")[:80])'
#     A ~64-token reasoning block (a few hundred chars) plus a real answer = enforced. Thousands of
#     chars of reasoning = the field was ignored; check the server version.
#
# ---------------------------------------------------------------------------------------------
# 2. LAUNCH
# ---------------------------------------------------------------------------------------------
#   ray stop; ray start --head    # fresh head so cpu_scheduler picks up num-cpus-per-task: 1
#   cd src && tmux new -s bl_qwen_cp
#   python run_sweep.py sweeps/baselines_qwen_cp.yaml --print-cmds        # inspect first
#   python run_sweep.py sweeps/baselines_qwen_cp.yaml --sweep-dir <big-disk>/runs/baselines_qwen_cp
#   python run_sweep.py --status <big-disk>/runs/baselines_qwen_cp
#
#   USE A LOCAL DISK, NOT AN NFS HOME, for --sweep-dir. Measured on the INESC box: the sandbox writes
#   each candidate's program and reads back its pickled result through the run directory, costing
#   ~80 ms/candidate on NFS versus ~0.3 ms on local disk. Small next to grading, but it is pure waste
#   and a campaign writes ~1M small files.
#
#   `--stop` does NOT stop the supervisor, only the live runs — it will immediately launch the next
#   queued run. To halt for real: kill the run_sweep.py pid FIRST, then --stop.
#
#   DISK: ~8 KB/candidate with `save-reasoning: false` (set below) => ~24 MB/run => ~0.5 GB for these
#   20 runs. ~22 KB/candidate if traces are kept. Measured on gpt-oss at effort medium, so treat it as
#   an order of magnitude for Qwen and re-check on the first run.
#
# ---------------------------------------------------------------------------------------------
# 3. CONCURRENCY — INHERITED FROM THE gpt-oss CAMPAIGN, RE-VERIFY HERE
# ---------------------------------------------------------------------------------------------
# num-cpus-per-task: 1.  On the INESC box every eval child was single-threaded (nlwp=1, 99.9 % of one
#   core) and pinned to exactly one core, while Ray reserved 2 CPUs for it — so half the box sat idle
#   and Ray still reported a task backlog. That is a property of the problem code plus the OMP/BLAS
#   caps the sandbox sets, not of the host, so it should hold here too. Confirm once, mid-run:
#     ps -eo pid,ppid,nlwp,pcpu,cmd | grep -A1 ray::run_program
#   The eval children should show nlwp=1. Also `ray status` should NOT show pending CPU demand while
#   cores are free.
#
# eval-timeout: LEFT AT THE REGISTRY DEFAULT (530 s). An earlier version of this file said 120 s,
#   derived from 45 hand-timed gpt-oss solutions (p50 0.36 s, MAX 69.6 s). THAT WAS WRONG, and the
#   live gpt-oss campaign proved it within four generations. Measured over VALID candidates only:
#         run                 n     p50     p90     p99     MAX
#         cp26 initial      282    1.5 s  18.1 s  87.1 s  133.9 s
#         cp26 PUCT         146    8.1 s 113.1 s 215.6 s  221.7 s   <-- pinned at the 220 s cap
#         cp32 initial      309    1.2 s   5.6 s  68.2 s  139.7 s
#         cp32 PUCT         215    5.6 s  79.0 s 201.3 s  220.2 s   <-- pinned at the 220 s cap
#   Two mistakes: 45 samples out of ~2,100 was far too few to see the tail, and they all came from a
#   `parent-source: initial` run — the cheapest cell. PUCT is qualitatively different: it selects good
#   parents, the model elaborates them, and eval cost CLIMBS ACROSS GENERATIONS. cp26_puct went
#   eval p50 2.7 s -> 23.8 s -> 225.5 s while success_rate collapsed 0.67 -> 0.64 -> 0.15, with 85
#   eval_timeouts in 300 candidates. A tight timeout does not just cost speed there, it biases the
#   search toward cheap programs and quietly guts the PUCT baseline.
#   So: start generous and let the data set it. Watch eval_p90/p99 over VALID candidates per
#   generation (progress.csv) and the "(N% used by the slowest)" figure in icl.log. Only tighten if
#   the tail stays far below the limit for BOTH parent-sources over many generations.
#
# max_parallel: 3 (was 4 before the 64-core count and the eval-time data above).  Circle packing is
#   still the GPU-bound family, but it is NOT as cheap to grade as first estimated: with a p90 of
#   80-113 s on the PUCT arm, 3 runs x 100 candidates against 64 slots is a real grading load, and a
#   generation is gated by the SLOWEST candidate in each parent group rather than by CPU throughput.
#   A B200 also decodes far faster than 2xA100, which shortens the generation phase and raises the CPU
#   share further. Verify, do not trust: `queue_p50` in progress.csv should stay near 0 (raise to 4 if
#   it does) and `num_requests_waiting` on the server should stay ~0.
#
# ---------------------------------------------------------------------------------------------
# 4. COST
# ---------------------------------------------------------------------------------------------
# Unmeasured on this hardware — Qwen has never been run against these prompts. Order of magnitude: a
# 27B dense model on a B200 should decode roughly 4-6x faster than 120B-MoE on 2xA100 (~27 GB of
# weights against ~8 TB/s, versus ~63 GB against 2x1.94 TB/s), and a 10k thinking cap holds the tail
# down where gpt-oss had no cap at all. 20 runs x 30 generations x 100 candidates = 60,000 candidates.
#
# Note which half that speeds up: on the gpt-oss campaign a circle_packing generation was ~450 s, of
# which only ~215 s was decode — the rest is the grading tail, set by the slowest candidate in each
# parent group (up to 220 s). A faster GPU and a tighter thinking budget both shrink the decode half
# only, so do NOT expect the 4-6x to show up in wall clock. Re-derive from the first finished run's
# `tokens_per_completion` / `wall_seconds` / `eval_p90` rather than trusting any of this.
#
# FIRST RUN ON THIS BOX: read these, in order of what would hurt most if wrong.
#   1. IS THE REASONING CAP ENFORCED? `reasoning_tokens` in progress.csv must sit at/below 26000 and
#      decode_max must not pin to max-tokens. If it runs past, the server ignored the field.
#   2. IS REASONING BEING SEPARATED? If icl.log warns that the server exposes no reasoning, the
#      parser is missing — see the --reasoning-parser note above; this is a correctness bug.
#   3. success_rate — the prompts are gpt-oss-era, verbatim from TTT-Discover. A collapsed success
#      rate is more likely a prompt/format mismatch than a model failure. Read a couple of
#      generations/gen_0000/parent_00/child_00.txt by hand before scaling up.
#   4. eval_p99 / eval_max vs eval-timeout 120 (see above).
# =================================================================================================

sweep:
  name: baselines_qwen_cp
  max_parallel: 3                # see 3. GPU-bound family, but 64 cores and a fat eval-time tail on
                                 # the PUCT arm; raise to 4 only if queue_p50 stays ~0.
  stagger: 120                   # keep generation phases off the same grading barrier
  server_max_num_seqs: 256       # must match the server's --max-num-seqs

common:
  # --- model / server -------------------------------------------------------------------------
  model: Qwen/Qwen3.6-27B-FP8
  vllm-base-url: http://localhost:8001/v1
  reasoning-effort: none         # gpt-oss-only knob; `none` keeps it out of the request entirely

  # --- token budgets (fixed across every experiment in this project) --------------------------
  thinking-token-budget: 10000   # HARD cap on reasoning tokens; vLLM force-emits </think> at the
                                 # limit so the candidate still produces an answer. NOT TTT-Discover's
                                 # 26,000 — deliberately tighter for now, which mainly cuts cost.
                                 # For reference, gpt-oss at reasoning-effort medium (which has NO
                                 # cap available) averaged ~4,100 decode tokens/candidate with a max
                                 # of 21,241, so a 10k ceiling is roughly comparable in practice and
                                 # only binds on the tail. Watch `reasoning_tokens` and `truncated` in
                                 # progress.csv: if a large share of candidates hit exactly 10k and
                                 # return no code, that is the cap biting and it should go back up.
  max-tokens: 34000              # reasoning + answer. Loose on purpose now that thinking is capped at
                                 # 10k (leaving ~24k for the answer): shrinking it would save nothing,
                                 # since KV was never the binding constraint and preemptions were 0.
                                 # Kept identical across every experiment so budgets never differ.
  max-context-tokens: 94000      # inert at n-context 0; kept for budget parity with the ICL runs
  temperature: 1.0               # TTT-Discover's value

  # --- search shape --------------------------------------------------------------------------
  n-context: 0                   # THE baseline property: no past solutions in the prompt
  groups-per-batch: 5            # parents per generation
  group-size: 20                 # children per parent -> 100 candidates/generation
  num-generations: 30            # 3,000 candidates/run

  # --- execution -----------------------------------------------------------------------------
  save-reasoning: false          # traces off. Only the FILES go away: the reasoning/answer token
                                 # split, decode percentiles and truncation counts are still
                                 # measured and land in progress.csv. The SFT/RL experiments in the
                                 # plan train on traces, so reusing these runs as training data
                                 # would mean re-running them.
  max-gen-concurrency: 5         # = groups-per-batch: all 5 parents' requests in flight at once
  num-cpus-per-task: 1           # see 3. MUST match the Ray head's cpu_scheduler group_size, which
                                 # is fixed by whichever run creates the actor -> restart the head
                                 # when switching between this file and baselines_qwen_hard.
  # eval-timeout: intentionally NOT set -> registry default (circle_packing 530 s). See section 3:
  #   valid gpt-oss solutions were measured at up to 221 s, and the PUCT arm's eval cost rises across
  #   generations, so a tight cap corrupts that baseline instead of merely speeding it up.

grid:
  # Key order = launch order. `seed` first finishes a whole replicate (both baselines, both problems)
  # before starting the next, so partial results are already analysable.
  seed: [1, 2, 3, 4, 5]
  parent-source: [initial, puct]
  problem: [circle_packing_26, circle_packing_32]
  # -> 20 runs named e.g. circle_packing_26_s-1_ps-initial
