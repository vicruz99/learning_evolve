# =================================================================================================
# TRIMUL KERNEL CAMPAIGN, FILE 2/4 -- PUCT with n-context 0. guadiana, A100 80GB PCIe.
#
# READ sweeps/trimul_bon_qwen.yaml FIRST. It carries the campaign notes that apply to all four files:
# the serial per-GPU grading queue, the unmeasured generation throughput (and the instruction to
# calibrate on the BoN file before launching this one), the KV-cache concurrency ceiling, the server
# command, and the expected scores. Nothing here repeats them.
#
# WHAT THIS ARM ISOLATES
#   The ONLY difference from file 1 is where parents come from: `parent-source: puct` instead of
#   `initial`. The context block is still empty (`n-context: 0`), so no past solution text ever
#   reaches the model. Past experience therefore acts through EXACTLY ONE channel -- which parent
#   PUCT chooses to expand -- which is TTT-Discover's search with the RL removed. Against file 1 this
#   measures the value of the search alone; against files 3 and 4 it is the no-prompt-memory control.
#
# WHY THE GENERATION BARRIER IS REAL HERE (unlike file 1)
#   PUCT reads the buffer to pick parents, so generation g+1 genuinely depends on g's results. The
#   barrier cannot be removed, and it costs more on trimul than on cp26: a generation ends only when
#   its slowest candidate has cleared the SERIAL grading queue, so with 2 groups x 16 = 32 candidates
#   per generation the tail is ~32 x 20 s of queue in the worst case. That is the price of the arm.
#
# SHAPE: 2 groups x 16 children x 5 generations = 160 candidates/run, matching every other arm.
#   5 generations is few, and deliberately so -- on cp26 the median share of total gain done by
#   generation 3 was 100 %, and here the per-generation cost is dominated by the serial grader. If
#   the calibration from file 1 shows headroom, raise num-generations before raising seeds: this arm's
#   whole point is that experience accumulates across generations.
#
# LAUNCH (after calibrating on file 1)
#   cd src && tmux new -s trimul_puct
#   python run_sweep.py sweeps/trimul_puct_qwen.yaml --print-cmds
#   python run_sweep.py sweeps/trimul_puct_qwen.yaml --ray-head skip
#   (--ray-head skip on EVERY machine: trimul never touches Ray, and the default `auto`
#   would start and hold an unused head sized to the whole box -- see file 1/4)
# =================================================================================================

sweep:
  name: trimul_puct_qwen
  max_parallel: 1                # one run at a time: see note 1 in trimul_bon_qwen.yaml -- grading
                                 # is a serial per-card queue, so parallel runs only add queueing.
  stagger: 180                   # longer than file 1: keep the runs' generation barriers out of
                                 # phase so they do not all hit the serial grader at once
  server_max_num_seqs: 256

common:
  # --- model / server (identical to file 1) ---------------------------------------------------
  model: Qwen/Qwen3.6-27B
  vllm-base-url: http://localhost:8001/v1
  reasoning-effort: none
  thinking-token-budget: 11000

  # --- token budgets (identical to file 1) ---------------------------------------------------
  max-tokens: 34000
  max-context-tokens: 40000
  temperature: 1.0

  # --- execution -----------------------------------------------------------------------------
  save-reasoning: false
  num-cpus-per-task: 1           # nominal only: no CPU group is taken, grading is the GPU lock

  # --- where kernels are graded (machine-specific, but declared here so config.json records it) ---
  trimul-eval-python: /scratch/vicstorage/learning_evolve/.venv/bin/python
  trimul-eval-gpu: "1"           # MUST be a card nothing else uses; GPU 0 holds the vLLM server
  trimul-eval-mode: leaderboard  # EXACTLY WHAT GUIDED TTT-DISCOVER'S SEARCH (env.py:132). One
                                 # evaluate.py subprocess per candidate, and that one run IS the
                                 # score -- we never pass --repeats, so nothing is re-graded or
                                 # averaged above eval.py. That subprocess runs two phases: the 18
                                 # `tests:` shapes must ALL pass, then the 7 `benchmarks:` shapes are
                                 # timed 3-100 reps each with correctness re-checked on every rep,
                                 # stopping at rel. error < 0.1 % (or 30 s GPU / 120 s wall). Score =
                                 # geometric mean of the 7 means; reward = 1500/us.
                                 # Measured on an idle A100: 36 s (13.2 test + 14.8 timed + startup),
                                 # scoring 2412 us. Bare `benchmark` mode is ~15 s and scores 2467 --
                                 # it skips the 18-shape correctness gate, so it rewards kernels this
                                 # search would discard. DO NOT MIX SCORES FROM THE TWO MODES.
  # trimul-evaluate-py:          # THE GRADER ITSELF -- deliberately not set. It defaults to
                                 # <repo>/coding_agent_evolve/gpumode/evaluate.py, resolved from
                                 # envs/kernel_trimul.py's own path, so any clone works unedited.
                                 # Set it only if the gpumode harness lives outside this repo.

  # --- the PUCT shape -------------------------------------------------------------------------
  parent-source: puct            # THE difference from file 1
  n-context: 0                   # past experience reaches the model ONLY through parent choice
  groups-per-batch: 2
  group-size: 16                 # 2 x 16 = 32 candidates/generation
  num-generations: 5             # 160 candidates/run
  max-gen-concurrency: 1

runs:
  - {name: a100_s1, problem: trimul_a100, seed: 1}
  - {name: a100_s2, problem: trimul_a100, seed: 2}
  - {name: a100_s3, problem: trimul_a100, seed: 3}
