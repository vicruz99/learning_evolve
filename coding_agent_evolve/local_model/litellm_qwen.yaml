# LiteLLM proxy: Anthropic Messages in, OpenAI out.
#
# Claude Code with ANTHROPIC_BASE_URL speaks the Anthropic Messages format only --
# POST /v1/messages (streaming SSE) and, optionally, /v1/messages/count_tokens.
# vLLM speaks OpenAI. This file is the whole translation layer.
#
#   litellm --config litellm_qwen.yaml --port 4000
#
# model_name is the string Claude Code sends (ANTHROPIC_MODEL in env.sh).
# litellm_params.model must match vLLM's --served-model-name, prefixed hosted_vllm/.
model_list:
  - model_name: qwen3.6-27b
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3.6-27B
      api_base: http://127.0.0.1:8001/v1
      api_key: none
      # Claude Code asks for far more than vLLM will grant on a 130k window; cap here
      # so a long conversation fails soft rather than 400-ing on max_tokens.
      max_tokens: 16384
      # Reasoning is deliberately UNCONSTRAINED. The model is agentic and decides when to
      # stop thinking; the ICL arm caps it (thinking-token-budget: 11000 in the trimul
      # sweeps) but that is a property of a single-shot generation, not of an agent loop.
      #
      # To cap it anyway, uncomment below. vLLM tracks the <think> section and forces the
      # end token once the budget is spent -- needs --reasoning-parser on the server.
      # The cut is hard, not graceful: too small and the model is left mid-sentence and
      # the "answer" is just the rest of its reasoning. 0 disables thinking entirely.
      # Claude Code has no knob to send this; MAX_THINKING_TOKENS only controls what it
      # *asks* for, and drop_params discards the ask before vLLM sees it.
      #
      # extra_body:
      #   thinking_token_budget: 11000

litellm_settings:
  # Claude Code sends Anthropic-only fields (cache_control, thinking, output_config).
  # Drop them instead of forwarding garbage to vLLM.
  drop_params: true

general_settings:
  master_key: sk-local
