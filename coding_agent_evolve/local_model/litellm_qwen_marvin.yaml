# LiteLLM proxy config for the Marvin (rb-hpc) agent jobs: Anthropic Messages in, OpenAI out.
#
# Same translation layer as litellm_qwen.yaml (read that file for the reasoning behind every
# knob); only what differs on Marvin is changed:
#   * the upstream is the FP8 checkpoint served on rng-dl01 and reached through the llmtun relay,
#     so api_base comes from the environment: jobs/marvin_agent.bsub exports VLLM_URL from
#     `llmtun url gpu2` (e.g. http://10.58.71.131:18002/v1). The relay IP must also be in
#     no_proxy -- the job script does that too.
#   * Marvin compute nodes have no internet, so the tokenizer must come from the local HF cache:
#     the job sets HF_HOME=$HOME/models/hf and HF_HUB_OFFLINE=1, and the cache holds the FP8
#     checkpoint's tokenizer files (provisioned once from rng-dl01). Without this, LiteLLM
#     silently falls back to tiktoken and Claude Code's 88k ceiling becomes fiction (README).
#
#   ~/venvs/ccproxy/bin/litellm --config litellm_qwen_marvin.yaml --port 4000
model_list:
  - model_name: qwen3.6-27b
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3.6-27B-FP8
      api_base: os.environ/VLLM_URL
      api_key: none
      max_tokens: 16384
      # Reasoning deliberately unconstrained, as in litellm_qwen.yaml (agentic loop, not a
      # single-shot generation). To cap: extra_body: {thinking_token_budget: 11000}.
    model_info:
      custom_tokenizer:
        identifier: Qwen/Qwen3.6-27B-FP8
        revision: main
        auth_token: null

litellm_settings:
  drop_params: true

general_settings:
  master_key: sk-local
