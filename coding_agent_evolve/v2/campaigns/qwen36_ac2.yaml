# Campaign qwen36_ac2 -- Qwen3.6-27B-FP8 on AC2, three prompts, two harnesses, one seed = 6 cells,
# all on the single tool-capable Qwen3.6 server (gpu8 w26n09:8002, max-model-len 180000, already
# carrying the ICL sweeps: "30/130 saturated").
#   bin/mkcell --cells campaigns/qwen36_ac2.yaml --campaign q36ac2
#   bin/submit q36ac2
# Qwen3.6 facts from the 2026-09 campaign: it stalls ~25 %/turn in bnbcode with reasoning-only
# turns, so the guard + driver nudges carry it; no reasoning-effort levels exist.
runs_root: ~/agent_runs/v2

defaults:
  model: Qwen/Qwen3.6-27B-FP8
  model_family: qwen3.6         # selects config/litellm_qwen36.yaml and the qwen3.6-<x> aliases; no effort kwargs sent
  relay_jobs: "gpu8:8002"       # the only tool-capable Qwen3.6 server
  python: /home/crv1pi/venvs/agent-eval/bin/python
  cores: 24                     # LSF slots per cell and the budget stated in the prompt
  mem_mb: 1                     # rusage[mem=] per task (MB). LSF charges a DEFAULT 1024 MB/task when omitted, and the batch_cpu hosts limit_memory (1.47 TB each) is exhausted by other users, so 1 MB is the only value that dispatches; MEMLIMIT stays 0 (unlimited)
  hours: 18                      # wall budget per cell (prompt + driver hard limit); LSF walltime = 6:30
  reasoning: xhigh              # ignored by Qwen3.6 except `off` (thinking disabled); kept for the cell name
  min_evals: 300                 # nudge without throttling until 30 official evaluations ...
  min_hours: 18                  # ... and 5 h have passed
  max_evals: 0                  # no eval cap
  keep_going: true              # then keep nudging (one per 5 min) until the 6 h budget
  nudge_min_gap_s: 300
  patience: 3                   # 3 tool-less turns -> fresh session, files kept
  give_up: 0                    # never record a refusal; the budget is the only end
  balance: true                 # rotate relay_jobs per cell -> cells alternate between the servers
  bnbcode:
    continual_work: false       # off: the campaign showed it costs 68 % of context; the driver nudges instead
    visible_output_guard: true
    guard_cap: 1000000
    output_tokens: 32768       # 2026-09-09: was 64000, leaving only 116000 of input room on a 180000 server -- the same overflow the Qwen3.8 cells hit. 32768 puts the ceiling at 147232, ~57k above the 90000 compaction point.
    context_tokens: 180000                # gpu8 --max-model-len; 180000 - 32768 output = compaction at 147232
    tool_output: {max_lines: 2000, max_bytes: 60000}   # a 200 KB tool result (~50k tokens) jumped the context from under the compaction point past the ceiling (2026-09-08); keep single results ~15k tokens
    compaction_context_limit: 90000      # MUST stay well below context_tokens - output_tokens (116000): at 250000 three cells hit ContextOverflowError on 2026-09-08 (a 200 KB tool result jumps the context past the ceiling before compaction fires)
    compaction_notes: false
    temperature: 0.6
    top_p: 0.95
  claude:
    max_output_tokens: 32768     # 2026-09-09: was 64000 (see the bnbcode note above)
    max_context_tokens: 120000   # autocompact at ~92 % = 110k, vLLM ceiling 180000 - 32768 = 147232, so ~37k of room per step
    autocompact: auto
    stop_hook: true
  seeds: [1]

cells:
  - {problem: AC2, harness: bnbcode, prompt: plain}
  - {problem: AC2, harness: bnbcode, prompt: evo}
  - {problem: AC2, harness: bnbcode, prompt: many}
  - {problem: AC2, harness: claude,  prompt: plain}
  - {problem: AC2, harness: claude,  prompt: evo}
  - {problem: AC2, harness: claude,  prompt: many}
