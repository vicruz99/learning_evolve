# m48_q38 -- 2026-09-21: 48 h agentic runs on MARVIN (rb-hpc), Qwen3.8-27B-FP8 served on Marvin's H100s.
# Erdos + AC1 + AC2, three prompts (plain / evo / many -- all three now carry the strengthened official-scoring
# block, prompts/scoring.md), two harnesses, ONE seed = 18 cells. No evaluation minimum: the budget is time only.
#   bin/mkcell --cells campaigns/marvin_q38_48h.yaml --campaign m48_q38 [--only <regex>]
#   bin/submit_marvin m48_q38 [--only <regex>] [--dry]
# Servers: two TP=2 vLLM jobs on the H100 nodes (~/work/vllm_marvin_q38.bsub: v2q38a :8003, v2q38b :8004), listed
# by LSF job name with the two GPU hosts as fixed fallbacks; the relay uses whichever answers a tool-call probe.
runs_root: ~/agent_runs/v2
defaults:
  site: marvin                  # names the cluster in the prompt, skips the rng-dl01 /home guard, selects bin/submit_marvin
  host_type: amd                # subbin -h: AMD Genoa nodes (64 cores, SMT off); Intel gives 48 cores and is 1.9x slower on np.convolve
  wall_extra_h: 24              # LSF walltime = hours + this: paused runs wait inside the job
  model: Qwen/Qwen3.8-27B-FP8
  model_family: qwen3.8
  relay_jobs: "v2q38a:8003,v2q38b:8004,rb-hpc-b19gpd01:8003,rb-hpc-b20gpd01:8003,rb-hpc-b19gpd01:8004,rb-hpc-b20gpd01:8004"
  balance: true                 # rotate per cell -> half the cells prefer server a, half server b
  python: /home/crv1pi/venvs/agent-eval/bin/python
  cores: 63                     # `small` caps AMD jobs at 63 cores/node (esub: "above queue core limit of 63"; `short` allows 64).
                                # Stated in the prompt; nproc inside the job reports the affinity mask, so the two agree.
  mem_mb: 0                     # subbin: whole node, no reservation needed
  hours: 48
  reasoning: xhigh
  min_evals: 0                  # NO evaluation quota: the run is bounded by time only
  min_hours: 48                 # every stop before the budget is nudged (throttled after the first hour by nudge_min_gap_s)
  max_evals: 0
  keep_going: true
  nudge_min_gap_s: 300
  stall_hours: 2                # 2 h without eval/file/tool/store activity -> harness restart, files kept (agent-side wedge)
  patience: 3
  give_up: 0
  bnbcode:
    continual_work: true
    visible_output_guard: true  # bnbcode feature, no bug found (2026-09-21): the r2 storm was guard_cap 1000000
    guard_cap: 8
    output_tokens: 65536
    context_tokens: 262144
    tool_output: {max_lines: 2000, max_bytes: 60000}
    compaction_context_limit: 110000
    compaction_notes: false
    temperature: 0.6
    top_p: 0.95
  claude:
    max_output_tokens: 65536
    max_context_tokens: 160000
    autocompact: auto           # ignored when cliff is on (DISABLE_AUTO_COMPACT=1)
    stop_hook: true
    cliff: true                 # CliffCompaction proxy in front of LiteLLM; compaction parity with bnbcode
    cliff_threshold: 110000     # = bnbcode compaction_context_limit
    cliff_keep_recent: 3
  seeds: [1]
cells:
  - {problem: Erdos, harness: bnbcode, prompt: plain}
  - {problem: Erdos, harness: bnbcode, prompt: evo}
  - {problem: Erdos, harness: bnbcode, prompt: many}
  - {problem: Erdos, harness: claude,  prompt: plain}
  - {problem: Erdos, harness: claude,  prompt: evo}
  - {problem: Erdos, harness: claude,  prompt: many}
  - {problem: AC1,   harness: bnbcode, prompt: plain}
  - {problem: AC1,   harness: bnbcode, prompt: evo}
  - {problem: AC1,   harness: bnbcode, prompt: many}
  - {problem: AC1,   harness: claude,  prompt: plain}
  - {problem: AC1,   harness: claude,  prompt: evo}
  - {problem: AC1,   harness: claude,  prompt: many}
  - {problem: AC2,   harness: bnbcode, prompt: plain}
  - {problem: AC2,   harness: bnbcode, prompt: evo}
  - {problem: AC2,   harness: bnbcode, prompt: many}
  - {problem: AC2,   harness: claude,  prompt: plain}
  - {problem: AC2,   harness: claude,  prompt: evo}
  - {problem: AC2,   harness: claude,  prompt: many}
