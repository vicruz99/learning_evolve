# q38ac_r3 -- 2026-09-14 rerun of the cells that wedged, were contaminated or never ran in q38ac_r2.
# IDENTICAL prompts and limits to the _r2 campaign (comparability); only the harness hardening differs:
#   guard_cap 8, stall_hours 2, relay -> "gpu38:8001", plus the driver/launch/submit fixes of 2026-09-14.
#   bin/mkcell --cells campaigns/qwen38_ac_r3.yaml --campaign q38ac_r3 [--only <regex>]   then   bin/submit q38ac_r3 --only <regex>
# Campaign qwen38_ac -- Qwen3.8-27B-FP8 on AC1 + AC2, three prompts, two harnesses, two seeds
# = 24 cells. Two tool-capable servers (gpu10 w26n16:8001, gpu11 w26n10:8002): 12 cells per
# server if everything runs at once. Recommended: submit seed 1 first (6 per server),
#   bin/mkcell --cells campaigns/qwen38_ac.yaml --campaign q38ac
#   bin/submit q38ac --only '_s1$'        # then later:  bin/submit q38ac --only '_s2$'
runs_root: ~/agent_runs/v2

defaults:
  model: Qwen/Qwen3.8-27B-FP8
  model_family: qwen3.8         # selects config/litellm_qwen38.yaml and the qwen3.8-<effort> aliases
  relay_jobs: "gpu38:8001"   # 2026-09-14 tool-capable server(s) for the r3 reruns   # both tool-capable Qwen3.8 servers; each cell sticks to one, falls back to the other
  python: /home/crv1pi/venvs/agent-eval/bin/python
  cores: 32                     # LSF slots per cell and the budget stated in the prompt
  mem_mb: 1                     # rusage[mem=] per task (MB). LSF charges a DEFAULT 1024 MB/task when omitted, and the batch_cpu hosts limit_memory (1.47 TB each) is exhausted by other users, so 1 MB is the only value that dispatches; MEMLIMIT stays 0 (unlimited)
  hours: 18                      # wall budget per cell (prompt + driver hard limit); LSF walltime = 6:30
  reasoning: xhigh              # Qwen3.8 chat-template effort: low | medium | xhigh (template default) | off
  min_evals: 250                 # nudge without throttling until 30 official evaluations ...
  min_hours: 18                  # ... and 5 h have passed
  max_evals: 0                  # no eval cap
  keep_going: true              # then keep nudging (one per 5 min) until the 6 h budget
  nudge_min_gap_s: 300
  stall_hours: 2   # 2026-09-14: driver restarts the harness after 2 h without eval/file/tool activity (every r2 wedge)
  patience: 3                   # 3 tool-less turns -> fresh session, files kept
  give_up: 0                    # never record a refusal; the budget is the only end
  balance: true                 # rotate relay_jobs per cell -> cells alternate between the servers
  bnbcode:
    continual_work: true       # off: the campaign showed it costs 68 % of context; the driver nudges instead
    visible_output_guard: true
    guard_cap: 8   # 2026-09-14: 1000000 let one ACP turn re-prompt 6912 times (q36ac2_r2/ac2_evo_bnb)
    output_tokens: 65536       # 2026-09-09: was 120000, which left only 142144 tokens of input room (262144 - 120000). Three cells overflowed 50 min in: one step (xhigh reasoning + a tool result) grew the context from just under the 110000 compaction point to 142145, vLLM 400'd, and the driver dropped the conversation for a fresh session. 65536 puts the ceiling at 196608, ~86k above compaction.
    context_tokens: 262144                # gpu10/gpu11 --max-model-len
    tool_output: {max_lines: 2000, max_bytes: 60000}   # a 200 KB tool result (~50k tokens) jumped the context from under the compaction point past the ceiling (2026-09-08); keep single results ~15k tokens
    compaction_context_limit: 110000      # MUST stay well below context_tokens - output_tokens (142144): at 250000 three cells hit ContextOverflowError on 2026-09-08 (a 200 KB tool result jumps the context past the ceiling before compaction fires)
    compaction_notes: false
    temperature: 0.6
    top_p: 0.95
  claude:
    max_output_tokens: 65536     # 2026-09-09: was 120000 (see the bnbcode note above)
    max_context_tokens: 160000   # autocompact fires at ~92 % = 147k and the vLLM ceiling is 262144 - 65536 = 196608, so a single step has ~49k of room
    autocompact: auto
    stop_hook: true
  seeds: [1, 2]

cells:
  - {problem: AC2, harness: bnbcode, prompt: plain}
  - {problem: AC2, harness: bnbcode, prompt: evo}
  - {problem: AC2, harness: bnbcode, prompt: many}
  - {problem: AC2, harness: claude,  prompt: plain}
  - {problem: AC2, harness: claude,  prompt: evo}
  - {problem: AC2, harness: claude,  prompt: many}
  - {problem: AC1, harness: bnbcode, prompt: plain}
  - {problem: AC1, harness: bnbcode, prompt: evo}
  - {problem: AC1, harness: bnbcode, prompt: many}
  - {problem: AC1, harness: claude,  prompt: plain}
  - {problem: AC1, harness: claude,  prompt: evo}
  - {problem: AC1, harness: claude,  prompt: many}
