# AC1 -- autocorrelation inequality, upper bound (minimise). Numbers from src/envs/registry.py
# and src/envs/ac_inequalities.py; eval.py is byte-identical to the ICL grader.
name: AC1
title: Minimizing the Autocorrelation Inequality Upper Bound (AC1)
metric: upper bound
metric_word: score
maximize: false
entrypoint: propose_candidate
eval_function: evaluate_sequence
npy: height_sequence_1.npy
start_score: "2.0000"
target: "1.5030"
cpus_per_candidate: 2
score_regex: '^SCORE\s*=\s*(\S+)'
budget_s: 1000        # per-candidate time budget stated in the prompt (ICL: 1000 s)
kill_s: 1100          # hard kill stated in the prompt (ICL eval_timeout: 1100 s)
