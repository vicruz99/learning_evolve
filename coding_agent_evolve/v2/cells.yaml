# The experiment matrix. Every key is described in CONFIG.md. `bin/mkcell --campaign <name>` renders every (cell x seed) into
# ~/agent_runs/v2/<name>/<cell>/. Anything under `defaults` can be overridden per cell.
runs_root: ~/agent_runs/v2

defaults:
  model: Qwen/Qwen3.8-27B-FP8          # served model name (what the relay probes for)
  model_family: qwen3.8                 # qwen3.8 | qwen3.6: picks config/litellm_<family>.yaml, the Claude alias prefix, and whether reasoning_effort is sent
  # relay_port / litellm_port are assigned per cell (base from the campaign name + cell index); set
  # relay_port_base / litellm_port_base only to pin them. balance: true rotates relay_jobs per cell.
  balance: true
  relay_jobs: "*:8001,*:8002"           # where the vLLM servers are, in preference order. Each token is NAME:PORT with
                                        # NAME = an LSF job name of yours (gpu10), "*" (every RUN job of yours), or a fixed
                                        # host/IP (rng-dl01-w26n16, 10.124.70.5). Only servers that serve `model` AND pass a
                                        # real tool-call probe are used; the relay re-checks on every new connection.
  python: /home/crv1pi/venvs/agent-eval/bin/python
  cores: 24                             # {{CORES}} in the prompt AND the bsub -n
  hours: 6                              # {{HOURS}} in the prompt AND the driver's hard budget
  reasoning: xhigh                      # low | medium | xhigh | off  (Qwen3.8 chat template values)
  min_evals: 30                         # the driver nudges without throttling until this many official evals
  min_hours: 5                          # ... and until this much time has passed
  max_evals: 0                          # tracker cap; 0 = unlimited
  keep_going: true                      # after the minima: keep nudging (throttled) until the hard budget
  nudge_min_gap_s: 300                  # throttle once the minima are met
  patience: 3                           # barren turns before a fresh session (context reset, disk kept); 0 = never
  give_up: 0                            # consecutive barren turns before recording a refusal; 0 = never
  mem_mb: 4096                          # bsub rusage[mem=]; the 1 GB LSF default kills AC2 evals
  bnbcode:
    continual_work: false
    visible_output_guard: true
    guard_cap: 1000000
    output_tokens: 65536                # limit.output + OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX
    context_tokens: 262144              # limit.context; must not exceed the server's --max-model-len
    tool_output: {max_lines: 4000, max_bytes: 200000}
    compaction_context_limit: 250000    # bnbcode default (COMPACTION_FORCE_TOKENS); campaign used 110000/160000
    compaction_notes: true              # bnbcode default: reminders at 100k, every 50k, to write handoff notes; campaign: false
    temperature: 0.6
    top_p: 0.95
  claude:
    max_output_tokens: 65536
    max_context_tokens: 224000
    autocompact: auto                   # Claude Code default (--autocompact auto); campaign passed 160k
    stop_hook: true
  seeds: [1, 2]

cells:
  - {problem: AC2,   harness: bnbcode, prompt: plain}
  - {problem: AC2,   harness: bnbcode, prompt: evo}
  - {problem: AC2,   harness: bnbcode, prompt: many}
  - {problem: AC2,   harness: claude,  prompt: plain}
  - {problem: AC2,   harness: claude,  prompt: evo}
  - {problem: AC2,   harness: claude,  prompt: many}
  - {problem: AC1,   harness: bnbcode, prompt: plain}
  - {problem: AC1,   harness: bnbcode, prompt: evo}
  - {problem: AC1,   harness: bnbcode, prompt: many}
  - {problem: AC1,   harness: claude,  prompt: plain}
  - {problem: AC1,   harness: claude,  prompt: evo}
  - {problem: AC1,   harness: claude,  prompt: many}
  - {problem: Erdos, harness: bnbcode, prompt: plain}
  - {problem: Erdos, harness: bnbcode, prompt: evo}
  - {problem: Erdos, harness: bnbcode, prompt: many}
  - {problem: Erdos, harness: claude,  prompt: plain}
  - {problem: Erdos, harness: claude,  prompt: evo}
  - {problem: Erdos, harness: claude,  prompt: many}
