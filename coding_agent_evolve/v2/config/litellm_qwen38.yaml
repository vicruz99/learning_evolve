# LiteLLM shim for the Claude Code arm against Qwen3.8 (v2). Claude Code speaks only the
# Anthropic Messages API; vLLM only OpenAI chat completions. api_base is the llm_relay on the
# compute node (:9203), never a GPU node IP.
#
# Reasoning effort is selected by MODEL ALIAS: the driver points ANTHROPIC_MODEL at
# qwen3.8-<effort>, and each alias carries the matching chat_template_kwargs in extra_body.
# The Qwen3.8 chat template accepts exactly {low, medium, xhigh} (default xhigh) and 400s on
# anything else; `off` closes the think block. cc_sampling_hook.py also sets the kwargs from
# the alias name in case a LiteLLM release stops forwarding extra_body for hosted_vllm.
#
# custom_tokenizer.auth_token: null is required even though unused -- LiteLLM 1.97 subscripts the
# key; removing it turns every count_tokens call into a 500 (see experiments/OPERATOR_NOTES.md).
model_list:
  - model_name: qwen3.8-xhigh
    litellm_params: &qwen38
      model: hosted_vllm/Qwen/Qwen3.8-27B-FP8
      api_base: http://127.0.0.1:9203/v1
      api_key: none
      max_tokens: 32000
      temperature: 0.6
      top_p: 0.95
      extra_body: {chat_template_kwargs: {reasoning_effort: xhigh}}
    model_info: &tok
      custom_tokenizer:
        identifier: Qwen/Qwen3.8-27B-FP8
        revision: main
        auth_token: null
  - model_name: qwen3.8-medium
    litellm_params:
      <<: *qwen38
      extra_body: {chat_template_kwargs: {reasoning_effort: medium}}
    model_info: *tok
  - model_name: qwen3.8-low
    litellm_params:
      <<: *qwen38
      extra_body: {chat_template_kwargs: {reasoning_effort: low}}
    model_info: *tok
  - model_name: qwen3.8-off
    litellm_params:
      <<: *qwen38
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
    model_info: *tok
litellm_settings:
  drop_params: true
  callbacks: cc_sampling_hook.handler
general_settings:
  master_key: sk-local
