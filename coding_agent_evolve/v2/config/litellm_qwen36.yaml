# LiteLLM shim for the Claude Code arm against Qwen3.6-27B-FP8 (gpu8, w26n09:8002, max-model-len
# 180000, chat template v19). Same shape as litellm_qwen38.yaml; api_base is rewritten per cell.
# Qwen3.6 has no reasoning_effort levels, so low/medium/xhigh are all "thinking on" and only
# `off` differs (enable_thinking: false). cc_sampling_hook.py injects effort kwargs for
# qwen3.8-* aliases only.
model_list:
  - model_name: qwen3.6-xhigh
    litellm_params: &qwen36
      model: hosted_vllm/Qwen/Qwen3.6-27B-FP8
      api_base: http://127.0.0.1:9203/v1
      api_key: none
      max_tokens: 32000
      temperature: 0.6
      top_p: 0.95
    model_info: &tok36
      custom_tokenizer:
        identifier: Qwen/Qwen3.6-27B-FP8
        revision: main
        auth_token: null
  - model_name: qwen3.6-medium
    litellm_params: *qwen36
    model_info: *tok36
  - model_name: qwen3.6-low
    litellm_params: *qwen36
    model_info: *tok36
  - model_name: qwen3.6-off
    litellm_params:
      <<: *qwen36
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
    model_info: *tok36
litellm_settings:
  drop_params: true
  callbacks: cc_sampling_hook.handler
general_settings:
  master_key: sk-local
